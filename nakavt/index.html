<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NAKAVT · Basketball Knockout</title>
  <meta name="description" content="NAKAVT — a fast, addictive arcade basketball Knockout game. Tap to shoot, race for the rebound, knock out 9 rivals and become champion." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff7a1a'/%3E%3Cpath d='M16 1v30M1 16h30M6 6c6 4 6 16 0 20M26 6c-6 4-6 16 0 20' stroke='%23200' fill='none' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <canvas id="game"></canvas>

    <!-- In-game HUD -->
    <div id="hud" class="hud hidden">
      <div class="hud-top">
        <div class="hud-pill"><span class="hud-label">ROUND</span><span id="hud-round">1</span></div>
        <div class="hud-pill hud-alive"><span class="hud-label">LEFT</span><span id="hud-remaining">10</span></div>
        <div class="hud-pill"><span class="hud-label">SHOTS</span><span id="hud-shots">0</span></div>
        <button id="hud-sound" class="hud-icon" aria-label="Toggle sound">🔊</button>
      </div>
      <div id="hud-role" class="hud-role"></div>
    </div>

    <!-- UI screens are injected here -->
    <div id="ui"></div>
  </div>

  <script type="module" src="src/main.js"></script>
  <noscript>
    <div style="color:#fff;font-family:sans-serif;padding:2rem;text-align:center">
      NAKAVT requires JavaScript. Please enable it to play.
    </div>
  </noscript>
</body>
</html>
